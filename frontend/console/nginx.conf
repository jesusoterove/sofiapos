# Console SPA: serve static files; for any other path serve index.html so React Router can handle it.
# Without this, refreshing on /login (or any client route) returns 404.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing: try file, then directory, then fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache static assets (adjust paths if your build outputs different names)
    location ~* \.(?:css|js|jpg|jpeg|gif|ico|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
