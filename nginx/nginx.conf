# SofiaPOS production: reverse proxy and load balancer
# Routes /api, /uploads, /health to API; everything else to Console (SPA)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # WebSocket: when client sends Upgrade, forward it to backend so WSS/WS works through proxy
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream for API – load balancing across API instances (add more servers to scale)
    upstream api_backend {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        # Add more API replicas for higher load, e.g.:
        # server api:8000 max_fails=3 fail_timeout=30s;
        # keepalive 32;
    }

    # Upstream for Console (SPA) – single server unless you run multiple replicas
    upstream console_backend {
        server console:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API and uploads: proxy to API service (load balanced)
        # WebSocket: forward Upgrade/Connection so /api/v1/sync/ws/* works (WSS and HTTPS share this block)
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Longer timeouts for WebSocket (optional; uncomment if connections drop)
            # proxy_read_timeout 3600s;
            # proxy_send_timeout 3600s;
        }

        location /uploads/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Everything else: Console SPA (try file, then fallback to index.html for client-side routing)
        location / {
            proxy_pass http://console_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # Optional: HTTPS server (uncomment and mount ssl certs when ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     # ... same location blocks as above ...
    # }
}
